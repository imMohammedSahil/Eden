services:
  # 1. Django Backend Web Service
  - type: web
    name: eden-backend
    env: python
    runtime: python3.11
    buildCommand: "cd backend && chmod +x build.sh && ./build.sh"
    startCommand: "cd backend && gunicorn core.wsgi:application --timeout 120 --workers 1"
    healthCheckPath: /healthz
    envVars:
      - key: GUNICORN_CMD_ARGS
        value: "--timeout 120 --workers 1"
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: DJANGO_DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "*"
      - key: CELERY_TASK_ALWAYS_EAGER
        value: "True"
      - key: GEMINI_API_KEY
        sync: false # User will set their API Key in Render Dashboard
      - key: DATABASE_URL
        fromDatabase:
          name: eden-db
          property: connectionString

# 2. Managed PostgreSQL Database (Free Tier)
databases:
  - name: eden-db
    plan: free
